[package]
name = "hitori"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }
flate2 = "1"
geo-types = "0.7"
async-channel = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tiny-skia = "0.11"
ttf-parser = "0.25"
mvt-reader = "2.5"
resvg = { version = "0.45.1", default-features = false }
rust-embed = "8"
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }
# Same rustls 0.23 (ring) and webpki-roots 0.26 as ureq.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.21"
netstat2 = "0.11"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_Rpc", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[patch.crates-io]
# GPUI 0.2.2 with Chromium-style whole-pixel glyph advances and letter spacing (src/platform/linux/text_system.rs).
gpui = { path = "vendor/gpui" }
