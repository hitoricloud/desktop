[package]
name = "hitori"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }
flate2 = "1"
geo-types = "0.7"
async-channel = "2"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
image = { version = "0.25", default-features = false }
tiny-skia = "0.11"
ttf-parser = "0.25"
mvt-reader = "2.5"
resvg = { version = "0.45.1", default-features = false }
rust-embed = "8"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
unicode-segmentation = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# GPUI 0.2.2 with Chromium-style whole-pixel glyph advances and letter spacing (src/platform/linux/text_system.rs).
gpui = { path = "vendor/gpui" }
