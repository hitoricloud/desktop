# Tests on every push and pull request. Packages (Linux tar.gz, Windows zip, macOS DMG) on main, on tags and on
# manual runs; tags vX.Y.Z also publish a GitHub release, tags vX.Y.Z-macos build and release only the macOS DMG.
# Linux and macOS run on Namespace runners.
# The Xray core comes from a release of github.com/hitoricloud/Xray-core (XRAY_TAG in scripts/fetch-xray.sh).
# macOS: set the MACOS_SIGN_IDENTITY variable (certificate in the runner keychain) for a Developer ID signature.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debian 12 (glibc 2.36) keeps the Linux build runnable on older distributions.
  LINUX_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev

jobs:
  test:
    runs-on: namespace-profile-linux
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: |
          # shellcheck disable=SC2086 # one package per word
          apt-get update -qq && apt-get install -y -qq --no-install-recommends $LINUX_DEPS >/dev/null
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  xray:
    if: github.event_name != 'pull_request'
    runs-on: namespace-profile-linux
    container: debian:bookworm-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl unzip jq >/dev/null
      - uses: actions/checkout@v7
      - run: XRAY_TARGETS="linux-amd64 windows-amd64 darwin-arm64 darwin-amd64" scripts/fetch-xray.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xray
          path: bin/
          retention-days: 7

  linux:
    needs: xray
    if: ${{ !endsWith(github.ref, '-macos') }}
    runs-on: namespace-profile-linux
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: xray, path: bin }
      - run: |
          # shellcheck disable=SC2086 # one package per word
          apt-get update -qq && apt-get install -y -qq --no-install-recommends $LINUX_DEPS >/dev/null
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/

  windows:
    needs: xray
    if: ${{ !endsWith(github.ref, '-macos') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: xray, path: bin }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      # Shaders are compiled when the app starts (vendor/gpui directx_renderer.rs), so no fxc.exe here.
      - run: cargo build --release --locked
      - name: Smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          # The release build is a GUI app without a console: wait for it and check the exit code.
          Copy-Item bin\xray-windows-amd64.exe target\release\xray.exe
          Copy-Item bin\wintun.dll target\release\wintun.dll
          $p = Start-Process target\release\hitori.exe -ArgumentList "--smoke" -PassThru -Wait -RedirectStandardError smoke.err
          Get-Content smoke.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "hitori --smoke exited with $($p.ExitCode)" }
      - name: TUN self-test
        timeout-minutes: 3
        shell: pwsh
        run: |
          # The runner is already elevated, so `runas` needs no prompt: wintun, routes, WFP kill switch and teardown.
          $p = Start-Process target\release\hitori.exe -ArgumentList "--tun-selftest" -PassThru -Wait -RedirectStandardOutput tun.out -RedirectStandardError tun.err
          Get-Content tun.out, tun.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "hitori --tun-selftest exited with $($p.ExitCode)" }
          if (Get-NetAdapter -Name Hitori -ErrorAction SilentlyContinue) { throw "the Hitori adapter is still there" }
      - name: Screenshot
        timeout-minutes: 2
        shell: pwsh
        run: |
          # What the main window looks like on a real Windows desktop (not signed in), for review.
          $app = Start-Process target\release\hitori.exe -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $bmp.Save("screenshots\windows.png")
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: screenshot-windows
          path: screenshots/
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  macos:
    needs: xray
    runs-on: namespace-profile-macos
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: xray, path: bin }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Metal toolchain
        # GPUI compiles its Metal shaders at build time; Xcode 26 ships the compiler as a separate download.
        run: xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Version
        run: echo "VERSION=$(scripts/version.sh)" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Smoke test
        timeout-minutes: 2
        run: |
          cp bin/xray-darwin-arm64 target/aarch64-apple-darwin/release/xray
          chmod +x target/aarch64-apple-darwin/release/xray
          target/aarch64-apple-darwin/release/hitori --smoke
      - name: TUN self-test
        timeout-minutes: 3
        run: |
          # As root (no prompt): utun, routes, DNS of every service, pf kill switch and teardown.
          before="$(networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' | while read -r s; do networksetup -getdnsservers "$s"; done)"
          sudo -n target/aarch64-apple-darwin/release/hitori --tun-selftest
          after="$(networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' | while read -r s; do networksetup -getdnsservers "$s"; done)"
          [ "$before" = "$after" ] || { echo "DNS servers not restored"; echo "$before"; echo "$after"; exit 1; }
          [ ! -e "/Library/Application Support/Hitori VPN/tun.json" ] || { echo "TUN state left behind"; exit 1; }
          ! sudo -n pfctl -a com.apple/hitori -s rules 2>/dev/null | grep -q . || { echo "pf rules left behind"; exit 1; }
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/

  release:
    # Linux and Windows are skipped on -macos tags; any failure or cancellation still blocks the release.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.macos.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [test, linux, windows, macos]
    runs-on: namespace-profile-linux
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux,windows,macos}"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: Hitori ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
